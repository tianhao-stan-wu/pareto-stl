# params for initializing the experiment

project:
  name: "Intersection Pedestrian Crossing"
  seed: 42
  exp: "exp1"

carla:
  host: "localhost"
  port: 2000
  timeout: 10.0
  map: "Town10HD"
  dt: 0.1 
  sync_mode: true
  spectator:
    location: {x: -52.211, y: 19.228, z: 6.626}
    rotation: {pitch: -21.737, yaw: 81.193, roll: 0.000}

mpc:
  horizon: 2             
  num_samples: 10
  num_prob: 10        
  sim_start: 5
  emergency_start: 6     
  sim_end: 10
  type: "pareto"
  density: 2

theorem1:
  enabled: true
  eps: 0.05
  beta: 0.05
  N_approx: 10000
  
stl:
  pedestrian: 3.0
  ambulance: 5.0
  lane:
    x_min: -45.5
    x_max: -44.0
    y_min: 0
    y_max: 100

ego_vehicle:
  blueprint: "vehicle.tesla.model3"
  autopilot: True
  draw_route: False
  behavior: "normal"
  target_speed: 40
  spawn:
    location: {x: -45.214, y: 90.322, z: 0.5}
    rotation: {pitch: -2.933, yaw: -87.606, roll: 0.000}
  destination:
    location: {x: -45.214, y: -3.398, z: 1}
    rotation: {pitch: -3.156, yaw: -85.004, roll: 0.000}
  lr: 1.50            # dynamics params obtained from utils.py
  acc_min: -10
  acc_max: 6
  beta_min: -0.262    # beta_max = 0.262 (≈15.0°) → δ = 28.6°  → steer_max = 0.408
  beta_max: 0.262 
  width: 2.16   
  length: 4.79 
  warmup: 0.6

ambulance:
  blueprint: "vehicle.ford.ambulance"
  autopilot: True
  draw_route: False
  behavior: "aggressive"
  target_speed: 40
  spawn:
    location: {x: -45.146, y: 100.043, z: 2.194}
    rotation: {pitch: -5.294, yaw: -89.380, roll: 0.000}
  destination:
    location: {x: -45.654, y: 3.146, z: 2.324}
    rotation: {pitch: -6.836, yaw: -89.509, roll: 0.000}
  lr: 1.88
  acc_min: -8
  acc_max: 4
  beta_min: -0.133
  beta_max: 0.133
  width: 2.35   
  length: 6.37 
  std_acc: 1
  std_steer: 0.05
  warmup: 1
  proximity_threshold: 5

pedestrian:
  blueprint: "walker.pedestrian.0001"
  spawn:
    location: {x: -22.011, y: 36.775, z: 1.640}
    rotation: {pitch: -8.565, yaw: 178.503, roll: 0.000}
  mean_speed: 4
  std_speed: 3
  std_dir: 0.05

